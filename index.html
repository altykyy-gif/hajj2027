<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كشف حجاج ضواحي بنغازي 2027</title>
<meta name="description" content="كشف حجاج ضواحي بنغازي 2027 — بحث وفلترة وتصدير وطباعة، يعمل دون إنترنت">
<meta name="theme-color" content="#005045">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="maskable-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حجاج بنغازي">

<!-- خط Cairo: يُحمَّل مرة واحدة عند أول زيارة بالإنترنت ثم يُخزَّن للعمل دون إنترنت.
     أو ضع الملف fonts/Cairo.woff2 (أو Cairo.ttf) بجانب هذا الملف ليعمل دون أي اتصال إطلاقًا. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">

<style>
@font-face{
  font-family:'CairoLocal';
  src:url('fonts/Cairo.woff2') format('woff2'),url('fonts/Cairo.ttf') format('truetype');
  font-weight:200 1000;font-display:swap;
}
:root{
  --g900:#00352E; --g800:#005045; --g700:#0B6A5C; --g200:#BFD8D1; --g100:#DDEBE7; --g50:#EEF4F2;
  --gold:#C9A24B; --gold-d:#9B7A2C;
  --ink:#10302A; --mut:#587670; --line:#D2DFDA; --bg:#E9F0EE; --card:#fff; --warn:#B4472F;
  --font:'CairoLocal','Cairo','Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);
  font-size:15px;line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom,0);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;letter-spacing:.2px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- الواجهة العلوية ---------- */
.hero{
  position:relative;color:#fff;text-align:center;overflow:hidden;
  padding:calc(28px + env(safe-area-inset-top,0)) 16px 70px;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='84' height='84' viewBox='0 0 84 84'><g fill='none' stroke='white' stroke-opacity='.075' stroke-width='1.2'><rect x='15' y='15' width='54' height='54'/><rect x='15' y='15' width='54' height='54' transform='rotate(45 42 42)'/><circle cx='42' cy='42' r='9'/></g></svg>"),
    radial-gradient(120% 90% at 50% 0%,#0B6A5C 0%,var(--g800) 55%,var(--g900) 100%);
}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.logo-ring{
  width:136px;height:136px;margin:0 auto 14px;border-radius:50%;overflow:hidden;
  border:3px solid var(--gold);box-shadow:0 0 0 7px rgba(201,162,75,.18),0 14px 34px rgba(0,0,0,.35);
  background:var(--g800);
}
.logo-ring img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);display:block}
.hero h1{margin:0;font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:.2px}
.hero p{margin:4px 0 0;color:#CFE5DF;font-size:clamp(14px,2.4vw,17px);font-weight:500}

.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:880px;margin:-46px auto 0;padding:0 14px;position:relative;z-index:2;
}
.stat{background:var(--card);border-radius:var(--r);padding:12px 10px;text-align:center;box-shadow:0 8px 24px rgba(0,53,46,.14);border:1px solid var(--line);border-top:3px solid var(--gold)}
.stat b{display:block;font-size:clamp(22px,4.6vw,30px);font-weight:800;color:var(--g800);line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mut);font-weight:600}

.wrap{max-width:1280px;margin:0 auto;padding:0 14px}

/* ---------- شريط الأدوات ---------- */
.bar{
  position:sticky;top:0;z-index:30;margin:16px -14px 0;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0));
  background:rgba(233,240,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 280px;position:relative;min-width:0}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mut);width:20px;height:20px}
.search input{
  width:100%;height:46px;padding:0 42px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15.5px;
}
.search input:focus{border-color:var(--g700);outline:none;box-shadow:0 0 0 4px rgba(11,106,92,.14)}
.search .clr{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:34px;height:34px;border-radius:8px;color:var(--mut);display:none}
.search.has .clr{display:grid;place-items:center}
.btns{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.btn{
  height:46px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;font-weight:600;color:var(--g800);position:relative;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:var(--g50);border-color:var(--g200)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--g800);border-color:var(--g800);color:#fff}
.btn.pri:hover{background:var(--g700)}
.btn.on{background:var(--g100);border-color:var(--g700)}
.btn .bd{
  position:absolute;top:-7px;inset-inline-start:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#2b2100;
  font-size:12px;font-weight:800;display:none;place-items:center;padding:0 6px;
}
.btn .bd.show{display:grid}

.pop{
  position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:250px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 18px 44px rgba(0,53,46,.22);padding:8px;z-index:40;display:none;
}
.pop.open{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop button.it{
  width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:11px 12px;border-radius:10px;text-align:start;font-weight:600;
}
.pop button.it:hover{background:var(--g50)}
.pop small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.pop h5{margin:8px 10px 4px;font-size:12.5px;color:var(--mut);font-weight:700}
.pop label.ck{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:500}
.pop label.ck:hover{background:var(--g50)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop select{width:calc(100% - 20px);margin:2px 10px 8px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--g800)}
.p-sett{width:290px;max-height:70vh;overflow:auto}

/* ---------- المكاتب ---------- */
.offices{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 14px;border-radius:19px;border:1.5px solid var(--g200);
  background:#fff;color:var(--g800);font-weight:600;font-size:14px;transition:all .15s;
}
.chip em{font-style:normal;min-width:26px;height:24px;border-radius:12px;background:var(--g100);display:grid;place-items:center;font-size:12.5px;font-weight:800;padding:0 7px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--g700)}
.chip.on{background:var(--g800);border-color:var(--g800);color:#fff}
.chip.on em{background:var(--gold);color:#2b2100}
.chip.zero{opacity:.45}
.chip.all{padding:0 14px}

/* ---------- لوحة الفلاتر ---------- */
.fpanel{display:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:10px;box-shadow:0 6px 20px rgba(0,53,46,.07)}
.fpanel.open{display:block;animation:pop .16s ease-out}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 14px}
.fgroup{grid-column:1/-1;font-weight:800;color:var(--g800);font-size:14px;border-bottom:2px solid var(--g100);padding-bottom:4px;margin-top:4px;display:flex;align-items:center;gap:8px}
.fgroup:first-child{margin-top:0}
.fgroup::before{content:"";width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:4px}
.fld input,.fld select{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 11px;background:#fff}
.fld input:focus,.fld select:focus{border-color:var(--g700);outline:none;box-shadow:0 0 0 3px rgba(11,106,92,.13)}
.fld.act input,.fld.act select{border-color:var(--g700);background:var(--g50)}
.fld .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.factions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--mut);margin:0}

.active{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--g100);color:var(--g900);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px;font-weight:600}
.tag button{border:0;background:var(--g800);color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:12px;line-height:1}
.tag.clear{background:transparent;border:1.5px dashed var(--warn);color:var(--warn);padding:3px 12px;cursor:pointer}

.resline{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;color:var(--mut);font-weight:600;font-size:14px;gap:10px;flex-wrap:wrap}
.resline b{color:var(--g800)}

/* ---------- الجدول ---------- */
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 150px);box-shadow:0 6px 20px rgba(0,53,46,.07)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
.t thead th{
  position:sticky;top:0;z-index:5;background:var(--g800);color:#fff;font-weight:700;text-align:center;padding:12px 10px;white-space:nowrap;
  cursor:pointer;user-select:none;border-inline-start:1px solid rgba(255,255,255,.12);
}
.t thead th:hover{background:var(--g700)}
.t thead th .s{display:inline-block;width:12px;margin-inline-start:4px;opacity:.9;color:var(--gold);font-size:12px}
.t td{padding:10px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.t td.nm{text-align:start;font-weight:600;min-width:200px}
.t tbody tr:nth-child(even) td{background:#F7FAF9}
.t tbody tr:hover td{background:var(--g100)}
.t td.mut{color:#9AAEA9}
.t tr.grp td{background:var(--g100)!important;color:var(--g900);font-weight:800;text-align:start;padding:9px 14px;border-bottom:2px solid var(--gold)}
.t tr.grp td span{font-weight:600;color:var(--mut);margin-inline-start:8px}
.t a.ph{color:var(--g800);text-decoration:none;font-weight:600}
.t a.ph:hover{text-decoration:underline}
.ofc{display:inline-block;background:var(--g100);color:var(--g900);border-radius:8px;padding:2px 10px;font-weight:600;white-space:nowrap}

/* ---------- البطاقات ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 4px 14px rgba(0,53,46,.06)}
.card header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,var(--g50),#fff);border-bottom:1px solid var(--line)}
.card .no{flex:none;min-width:34px;height:34px;border-radius:50%;background:var(--g800);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13.5px;padding:0 6px}
.card h3{margin:0;font-size:16px;font-weight:800;line-height:1.35;flex:1}
.card .body{padding:8px 14px 12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row dt{color:var(--mut);font-weight:600;flex:none}
.row dd{margin:0;font-weight:600;text-align:end}
.comp{margin:0 10px 12px;border:1.5px solid var(--g200);border-radius:12px;padding:6px 12px 8px;background:var(--g50)}
.comp h4{margin:2px 0 2px;font-size:13px;color:var(--g800);font-weight:800}
.acts{display:flex;gap:6px;margin-top:4px;justify-content:flex-end}
.acts a{font-size:12.5px;font-weight:700;text-decoration:none;padding:4px 12px;border-radius:999px;border:1.5px solid var(--g700);color:var(--g800);background:#fff}
.acts a.wa{background:var(--g800);color:#fff}

.empty{text-align:center;padding:48px 16px;background:#fff;border:1px dashed var(--g200);border-radius:var(--r);color:var(--mut)}
.empty b{display:block;color:var(--g800);font-size:18px;margin-bottom:4px}

footer.f{margin:26px 0 24px;text-align:center;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#2fa36b}
.dot.off{background:var(--gold)}

#toast{
  position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0));display:flex;justify-content:center;pointer-events:none;z-index:99;
}
#toast span{background:var(--g900);color:#fff;border-radius:12px;padding:10px 18px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:all .2s}
#toast.show span{opacity:1;transform:none}

@media (max-width:980px){.fgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr);margin-top:-40px}
  .hero{padding-bottom:62px}
  .logo-ring{width:112px;height:112px}
  .fgrid{grid-template-columns:1fr}
  .btn span.l{display:none}
  .btn{padding:0 13px}
  .btns{width:100%;justify-content:space-between}
  .btns .btn{flex:1;justify-content:center}
  .pop{inset-inline-end:auto;inset-inline-start:0}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- الطباعة ---------- */
#printArea{display:none}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font-family:var(--font);color:#000}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.p-head{text-align:center;padding-bottom:6px}
.p-head img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid #C9A24B;display:block;margin:0 auto 6px}
.p-head h1{margin:0;font-size:19pt;font-weight:800;color:#005045}
.p-head h2{margin:2px 0 0;font-size:12pt;font-weight:600;color:#9B7A2C}
.p-rule{height:0;border-top:2.5px solid #005045;border-bottom:1px solid #C9A24B;padding-top:2px;margin:8px 0 6px}
.p-meta{display:flex;justify-content:space-between;gap:12px;font-size:9.5pt;color:#222;margin-bottom:6px;flex-wrap:wrap}
.p-meta b{color:#005045}
.p-filters{font-size:9pt;color:#333;background:#EEF4F2;border-right:4px solid #C9A24B;padding:4px 10px;margin-bottom:8px}
table.pt{width:100%;border-collapse:collapse;font-size:9.5pt}
.pt thead{display:table-header-group}
.pt th{background:#005045;color:#fff;padding:5px 5px;border:.6pt solid #003d35;font-weight:700;text-align:center}
.pt td{padding:4px 5px;border:.5pt solid #9db7b0;text-align:center;vertical-align:middle}
.pt td.nm{text-align:right;font-weight:600}
.pt tr{page-break-inside:avoid;break-inside:avoid}
.pt tbody tr:nth-child(even) td{background:#F3F7F6}
.pt tr.grp td{background:#DDEBE7!important;font-weight:800;text-align:right;color:#00352E;border-bottom:1.5pt solid #C9A24B;break-after:avoid}
.pt .ltr{direction:ltr;unicode-bidi:isolate}
.p-sign{display:flex;justify-content:space-around;margin-top:26px;font-size:10pt;font-weight:700;color:#005045;break-inside:avoid}
.p-sign div{text-align:center;min-width:150px}
.p-sign div::after{content:"";display:block;border-top:1px solid #555;margin-top:34px}
.p-foot{margin-top:14px;text-align:center;font-size:8.5pt;color:#555}
</style>
<style id="pageStyle">@page{size:A4 landscape;margin:12mm 10mm 14mm}</style>
</head>
<body>

<header class="hero">
  <div class="logo-ring"><img src="logo.jpg" alt="شعار الحج" width="136" height="136"></div>
  <h1>كشف حجاج ضواحي بنغازي</h1>
  <p>موسم الحج 2027</p>
</header>

<section class="stats" aria-label="إحصاءات">
  <div class="stat"><b id="stTotal">0</b><span>إجمالي الحجاج</span></div>
  <div class="stat"><b id="stShown">0</b><span>المعروض الآن</span></div>
  <div class="stat"><b id="stOff">0</b><span>عدد المكاتب</span></div>
  <div class="stat"><b id="stComp">0</b><span>معهم مرافق (المعروض)</span></div>
</section>

<div class="wrap">
  <div class="bar">
    <div class="bar-in">
      <div class="search" id="searchBox">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="ابحث بالاسم أو الرقم الوطني أو الهاتف أو رقم التسجيل…" autocomplete="off" enterkeyhint="search" aria-label="بحث شامل">
        <button class="clr" id="qClr" aria-label="مسح البحث"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="btns">
        <button class="btn" id="bFilter" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span class="l">الفلاتر</span><i class="bd" id="fBadge">0</i></button>
        <button class="btn" id="bView" title="تبديل العرض"><svg class="i" id="viewIco" viewBox="0 0 24 24"></svg><span class="l" id="viewLbl">بطاقات</span></button>
        <div style="position:relative;display:contents">
          <button class="btn" id="bSett" aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="l">الأعمدة والخيارات</span></button>
          <div class="pop p-sett" id="pSett"></div>
        </div>
        <div style="position:relative;display:contents">
          <button class="btn pri" id="bExp" aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="l">تصدير</span></button>
          <div class="pop" id="pExp">

const AD = '٠١٢٣٤٥٦٧٨٩', PD = '۰۱۲۳۴۵۶۷۸۹';
function norm(s){
  return String(s ?? '').toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/[ىیئ]/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ک/g,'ك')
    .replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[۰-۹]/g,d=>PD.indexOf(d))
    .replace(/\s+/g,' ').trim();
}

  d.cg = d.cnid ? (d.cnid[0]==='1'?'ذكر':d.cnid[0]==='2'?'أنثى':'') : '';
  const by = d.nid && /^\d{12}$/.test(d.nid) ? +d.nid.slice(1,5) : 0;

  d._f = {}; ['reg','name','nid','cname','cnid','phone','cphone','office','g','net'].forEach(k=>d._f[k]=norm(d[k]));

});

const TXT = ['reg','name','nid','cname','cnid','phone','cphone'];
const FREE = () => ({q:'',f:{},nFrom:'',nTo:'',offices:new Set(),g:'',cg:'',has:'',net:'',ageMin:'',ageMax:''});
let S = FREE();
const O = Object.assign({vis:DEFAULT_VIS,view:innerWidth<720?'cards':'table',group:false,renum:true,orient:'landscape',xsheets:true,sk:'',sd:1}, store.get('opts',{}));

function pass(d, skipOffice){
  if(S.q){for(const t of toks(S.q)) if(!d._all.includes(t)) return false}
  for(const k of TXT){const v=S.f[k]; if(v){for(const t of toks(v)) if(!d._f[k].includes(t)) return false}}
  if(S.nFrom!=='' && d.n < +S.nFrom) return false;
  if(S.nTo!==''   && d.n > +S.nTo) return false;
  if(!skipOffice && S.offices.size && !S.offices.has(d.office)) return false;
  if(S.g && d.g!==S.g) return false;
  if(S.cg && d.cg!==S.cg) return false;
  if(S.has==='yes' && !d.has) return false;
  if(S.has==='no' && d.has) return false;
  if(S.net && d.net!==S.net) return false;
  if(S.ageMin!=='' && (d.age==null || d.age < +S.ageMin)) return false;
  if(S.ageMax!=='' && (d.age==null || d.age > +S.ageMax)) return false;
  return true;
}
const cmpAr = (a,b)=>String(a||'').localeCompare(String(b||''),'ar');
function getRows(){
  let r = DATA.filter(d=>pass(d));
  const k=O.sk, dir=O.sd;
  const col = COLS.find(c=>c.k===k);
  r.sort((a,b)=>{
    if(O.group){const o=cmpAr(a.office,b.office); if(o) return o}
    if(!k) return a.n-b.n;
    let x=a[k], y=b[k];
    if(col && (col.num || k==='reg')){x=+x||0;y=+y||0;return (x-y)*dir||a.n-b.n}
    if(!x && y) return 1; if(x && !y) return -1;
    return cmpAr(x,y)*dir || a.n-b.n;
  });
  return r;
}
const visCols = () => COLS.filter(c=>O.vis.includes(c.k));

function activeList(){
  const a=[];

  if(S.q) a.push({t:'بحث: '+S.q, rm:()=>{S.q=''}});
  TXT.forEach(k=>{ if(S.f[k]) a.push({t:lbl[k]+': '+S.f[k], rm:()=>{delete S.f[k]}}) });
  if(S.nFrom!==''||S.nTo!=='') a.push({t:'م: من '+(S.nFrom||'…')+' إلى '+(S.nTo||'…'), rm:()=>{S.nFrom='';S.nTo=''}});
  S.offices.forEach(o=>a.push({t:'المكتب: '+o, rm:()=>S.offices.delete(o)}));
  if(S.g) a.push({t:'الجنس: '+S.g, rm:()=>{S.g=''}});
  if(S.cg) a.push({t:'جنس المرافق: '+S.cg, rm:()=>{S.cg=''}});
  if(S.has) a.push({t:S.has==='yes'?'لديهم مرافق':'بدون مرافق', rm:()=>{S.has=''}});
  if(S.net) a.push({t:'شبكة الهاتف: '+S.net, rm:()=>{S.net=''}});
  if(S.ageMin!==''||S.ageMax!=='') a.push({t:'العمر: '+(S.ageMin||'…')+' – '+(S.ageMax||'…'), rm:()=>{S.ageMin='';S.ageMax=''}});
  return a;
}

  const parts=[],central=[];let off=0;

    const nm=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data),sz=data.length;

    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);

    parts.push(new Uint8Array(h.buffer),nm,data);

    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+sz;
  });
  const csz=central.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);

  sheets.forEach(s=>{let n=s.name.replace(/[\[\]:*?\/\\]/g,'-').slice(0,31)||'ورقة';let b=n,i=2;while(used.has(n)){n=b.slice(0,28)+' '+i++}used.add(n);s.name=n});
  const files=[
    {name:'[Content_Types].xml',text:XH+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'},
    {name:'_rels/.rels',text:XH+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',text:XH+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'+sheets.map((s,i)=>`<sheet name="${esc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:XH+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',text:STYLES},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,text:sheetXml(s.name==='الكل'?title:`${title} — ${s.name}`,subOf(s.rows.length),cols,exportMatrix(s.rows,cols))}))
  ];
  download(zipStore(files),`حجاج-ضواحي-بنغازي-2027-${stamp()}.xlsx`);
  toast(`تم تصدير ${rows.length} صف إلى Excel`);
}

/* ===================== الطباعة ===================== */
function buildPrint(){
  const rows=getRows(), cols=visCols();
  const dateS=new Date().toLocaleDateString('ar-LY-u-nu-latn',{year:'numeric',month:'long',day:'numeric'});
  const fs=filterSummary();
  const cnt={}; rows.forEach(r=>cnt[r.office]=(cnt[r.office]||0)+1);
  let h=`<div class="p-head"><img src="logo.jpg" alt="الشعار"><h1>كشف حجاج ضواحي بنغازي</h1><h2>موسم الحج 2027</h2></div><div class="p-rule"></div>
  <div class="p-meta"><div>التاريخ: <b>${esc(dateS)}</b></div><div>عدد الحجاج في الكشف: <b>${rows.length}</b> من أصل ${DATA.length}</div></div>`;
  if(fs) h+=`<div class="p-filters"><b>الفلاتر المطبّقة:</b> ${esc(fs)}</div>`;
  h+='<table class="pt"><thead><tr>'+cols.map(c=>`<th>${esc(c.t)}</th>`).join('')+'</tr></thead><tbody>';
  let last=null,i=0;
  rows.forEach(d=>{
    i++;
    if(O.group && d.office!==last){last=d.office;h+=`<tr class="grp"><td colspan="${cols.length}">${esc(d.office)} — ${cnt[d.office]} حاج</td></tr>`}
    h+='<tr>'+cols.map(c=>{
      let v = c.k==='n' ? (O.renum?i:d.n) : (d[c.k]==null||d[c.k]===''?'—':d[c.k]);
      if(c.ltr||c.tel) v=`<span class="ltr">${esc(v)}</span>`; else v=esc(v);
      return `<td class="${c.nm?'nm':''}">${v}</td>`;
    }).join('')+'</tr>';
  });
  h+='</tbody></table><div class="p-sign"><div>المسؤول المختص</div><div>الختم</div></div><div class="p-foot">كشف حجاج ضواحي بنغازي 2027</div>';
  $('#printArea').innerHTML=h;
  $('#pageStyle').textContent=`@page{size:A4 ${O.orient};margin:12mm 10mm 15mm;@bottom-center{content:"صفحة " counter(page) " من " counter(pages);font-family:'CairoLocal','Cairo',Tahoma,sans-serif;font-size:9pt;color:#555}}`;
}
function doPrint(){
  if(!getRows().length){toast('لا توجد صفوف للطباعة');return}
  buildPrint();
  const img=$('#printArea img');
  const go=()=>setTimeout(()=>window.print(),80);
  (img && !img.complete) ? (img.onload=go,img.onerror=go) : go();
}
window.addEventListener('beforeprint',buildPrint);

/* ===================== ربط الأحداث ===================== */
function init(){
  buildPanel(); buildSettings();
  pop($('#bSett'),$('#pSett')); pop($('#bExp'),$('#pExp'));
  $('#pExp').addEventListener('click',e=>{
    const b=e.target.closest('[data-exp]'); if(!b) return;
    $('#pExp').classList.remove('open');
    ({xlsx:exportXLSX,csv:exportCSV,copy:copyTable})[b.dataset.exp]();
  });
  $('#bFilter').onclick=()=>togglePanel();
  $('#bPrint').onclick=doPrint;
  $('#bView').onclick=()=>{O.view=O.view==='table'?'cards':'table';saveO();render()};
  let qt; $('#q').addEventListener('input',e=>{
    clearTimeout(qt); qt=setTimeout(()=>{S.q=e.target.value;$('#searchBox').classList.toggle('has',!!S.q);render()},120);
  });
  $('#qClr').onclick=()=>{S.q='';$('#q').value='';$('#searchBox').classList.remove('has');render();$('#q').focus()};
  $('#offices').onclick=e=>{
    const b=e.target.closest('[data-o]'); if(!b) return;
    const o=b.dataset.o;
    if(!o) S.offices.clear(); else S.offices.has(o)?S.offices.delete(o):S.offices.add(o);
    render();
  };
  $('#view').addEventListener('click',e=>{
    const th=e.target.closest('th[data-k]'); if(!th) return;
    const k=th.dataset.k;
    if(O.sk!==k){O.sk=k;O.sd=1} else if(O.sd===1) O.sd=-1; else {O.sk='';O.sd=1}
    saveO(); render();
  });
  document.addEventListener('keydown',e=>{ if(e.key==='/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()} });
  render();
}
init();

/* ===================== الشبكة و PWA ===================== */
function net(){const on=navigator.onLine;$('#netDot').classList.toggle('off',!on);$('#netTxt').textContent=on?'متصل — والصفحة تعمل أيضًا دون إنترنت':'تعمل الآن دون إنترنت'}
addEventListener('online',net);addEventListener('offline',net);net();

let dip;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!isStandalone())$('#bInstall').hidden=false});
$('#bInstall').onclick=async()=>{
  if(dip){dip.prompt();try{await dip.userChoice}catch(_){}dip=null;$('#bInstall').hidden=true}
  else if(isIOS) alert('للتثبيت على الآيفون:\n1) اضغط زر المشاركة في Safari\n2) اختر «إضافة إلى الشاشة الرئيسية»');
  else alert('للتثبيت:\nافتح قائمة المتصفح (⋮) ثم اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».');
};
addEventListener('appinstalled',()=>{$('#bInstall').hidden=true;toast('تم تثبيت التطبيق')});
if(!isStandalone())$('#bInstall').hidden=false;

if('serviceWorker' in navigator){
  addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}) });
}
</script>
